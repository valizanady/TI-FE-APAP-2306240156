name: FE CI Pipeline

on:
  push:
    branches:
      - main
      - backlog

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}
  IMAGE_TAG: ${{ github.sha }}
  # Production URLs - Tour Package Service
  VITE_API_BASE_URL: http://2306240156-be.hafizmuh.site/api/
  VITE_AUTH_SERVICE_URL: http://2306275166-fe.hafizmuh.site
  VITE_AUTH_BACKEND_URL: http://2306240156-be.hafizmuh.site/api/auth


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app with ENV
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          VITE_AUTH_SERVICE_URL: ${{ env.VITE_AUTH_SERVICE_URL }}
          VITE_AUTH_BACKEND_URL: ${{ env.VITE_AUTH_BACKEND_URL }}
        run: |
          echo "🔧 Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"
          npm run build
          echo "✅ Build completed"

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 1

  docker-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Debug - Check dist contents
        run: |
          echo "📁 Checking dist folder contents:"
          ls -la dist/ || echo "❌ dist folder not found!"
          echo "========================================="

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Debug - Check ENV
        run: |
          echo "========================================="
          echo "🔍 Environment Variables Check:"
          echo "VITE_API_BASE_URL = ${{ env.VITE_API_BASE_URL }}"
          echo "DOCKER_IMAGE_NAME = $DOCKER_IMAGE_NAME"
          echo "IMAGE_TAG = $IMAGE_TAG"
          echo "========================================="

      - name: Build Docker image
        run: |
          docker build \
            --progress=plain \
            -t $DOCKER_IMAGE_NAME:$IMAGE_TAG \
            -t $DOCKER_IMAGE_NAME:latest .
          echo "✅ Docker image built successfully"

      - name: Push Docker images
        run: |
          docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
          docker push $DOCKER_IMAGE_NAME:latest
          echo "✅ Pushed: $DOCKER_IMAGE_NAME:$IMAGE_TAG"
          echo "✅ Pushed: $DOCKER_IMAGE_NAME:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Checkout again
        uses: actions/checkout@v4

      - name: Setup SSH client
        run: |
          sudo apt-get update
          sudo apt-get install -y ssh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Replace image tag in deployment.yaml
        run: sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml

      - name: Transfer k8s files to EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/app/k8s"
          scp deployment.yaml \
              k8s/service.yaml \
              k8s/ingress.yaml \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/app/k8s/

      - name: Apply Kubernetes manifests on k3s
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/deployment.yaml &&
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/service.yaml &&
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f ~/app/k8s/ingress.yaml
          "
