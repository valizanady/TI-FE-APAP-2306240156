stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: ${DOCKER_IMAGE_NAME}
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:20
  script:
    - echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" > .env.production
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
      - Dockerfile
      - nginx.conf
      - k8s/deployment.yaml
      - k8s/service.yaml
      - k8s/ingress.yaml
    expire_in: 1 hour
  only:
    - feat/praktikum-9

docker-push:
  stage: docker-push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    # ✅ Verify that environment variables are set
    - |
      echo "========================================"
      echo "🔧 Docker Build Configuration Check:"
      echo "VITE_API_BASE_URL = ${VITE_API_BASE_URL:-NOT_SET}"
      echo "DOCKER_IMAGE_NAME = ${DOCKER_IMAGE_NAME:-NOT_SET}"
      echo "IMAGE_TAG = ${IMAGE_TAG:-NOT_SET}"
      echo "========================================"

      if [ -z "$VITE_API_BASE_URL" ]; then
        echo "❌ ERROR: VITE_API_BASE_URL is not set in GitLab CI/CD Variables!"
        echo "Please add it in: Settings > CI/CD > Variables"
        exit 1
      fi
  script:
    # Build Docker image with API URL as build argument
    - |
      docker build \
        --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
        --progress=plain \
        -t "$DOCKER_IMAGE_NAME:$IMAGE_TAG" \
        -t "$DOCKER_IMAGE_NAME:latest" \
        .

    # Push both tags
    - docker push "$DOCKER_IMAGE_NAME:$IMAGE_TAG"
    - docker push "$DOCKER_IMAGE_NAME:latest"

    # Verify image was pushed
    - echo "✅ Docker image pushed successfully:"
    - echo "   - $DOCKER_IMAGE_NAME:$IMAGE_TAG"
    - echo "   - $DOCKER_IMAGE_NAME:latest"
  only:
    - feat/praktikum-9

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

    - |
      echo "=== SSH CONNECTION CHECK ==="
      ssh -vvv $EC2_USER@$EC2_HOST "echo CONNECTED"

  script:
    # Replace image tag
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml

    # Prepare folder in EC2
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/tourpackage-fe/k8s"

    # Upload k8s files
    - scp deployment.yaml $EC2_USER@$EC2_HOST:~/app/tourpackage-fe/k8s/deployment.yaml
    - scp k8s/service.yaml $EC2_USER@$EC2_HOST:~/app/tourpackage-fe/k8s/service.yaml
    - scp k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/tourpackage-fe/k8s/ingress.yaml

    # Apply YAML
    - ssh $EC2_USER@$EC2_HOST "sudo k3s kubectl apply -f ~/app/tourpackage-fe/k8s/"
    - ssh $EC2_USER@$EC2_HOST "sudo k3s kubectl rollout status deployment/tourpackage-fe -n default"

  only:
    - feat/praktikum-9
